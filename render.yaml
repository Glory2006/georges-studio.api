services:
  - type: web
    name: georges-studio-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/ping

    envVars:
      - key: NODE_ENV
        value: production

      - key: PORT
        value: 10000

      - key: CORS_ORIGIN
        sync: false

      - key: SUPABASE_URL
        sync: false

      - key: SUPABASE_ANON_KEY
        sync: false

      - key: JWT_SECRET
        sync: false

      - key: EMAIL_USER
        sync: false

      - key: EMAIL_PASS
        sync: false

      - key: PHOTOGRAPHER_EMAIL
        sync: false

      - key: ADMIN_URL
        sync: false
